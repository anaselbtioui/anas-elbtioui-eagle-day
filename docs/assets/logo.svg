  <path stroke="#fff" stroke-width="7" stroke-linecap="round" d="M148 72c10-6 22-6 32 2" />
  <!-- eyes (looking up-right) -->
  <ellipse cx="112" cy="108" rx="18" ry="26" fill="#fff" />
  <ellipse cx="168" cy="100" rx="18" ry="26" fill="#fff" />
  <circle cx="118" cy="98" r="7" fill="#102860" />
  <circle cx="174" cy="90" r="7" fill="#102860" />
  <!-- blush -->
  <rect x="78" y="138" width="28" height="10" rx="5" fill="#90d0b0" />
  <rect x="168" y="132" width="28" height="10" rx="5" fill="#90d0b0" />
  <!-- smile -->
  <path stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" d="M118 148c10 14 34 16 48 2" />
  <!-- spark lines -->
  <rect x="198" y="28" width="22" height="10" rx="5" fill="#209070" transform="rotate(28 209 33)" />
  <rect x="214" y="52" width="18" height="9" rx="4.5" fill="#209070" transform="rotate(18 223 56.5)" />
  <rect x="218" y="74" width="14" height="8" rx="4" fill="#209070" transform="rotate(8 225 78)" />
  <!-- check badge -->
  <circle cx="196" cy="188" r="36" fill="#209070" />
  <circle cx="196" cy="188" r="36" stroke="#fff" stroke-width="6" />
  <path
    stroke="#fff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    d="M178 188l12 12 24-28"
